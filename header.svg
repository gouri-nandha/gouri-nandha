<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Hey, I'm Gouri - Learning to code, building small projects, growing every day" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#1b1b4b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="bd" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <clipPath id="typeclip">
      <rect x="120" y="148" height="42" width="0">
        <animate attributeName="width" values="0;660;660;0" keyTimes="0;0.4;0.9;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <clipPath id="card">
      <rect x="0" y="0" width="900" height="260" rx="24"/>
    </clipPath>
  </defs>

  <style>
    .title { fill: url(#tg); animation: pop 1s ease-out both; }
    @keyframes pop { 0% { opacity: 0; transform: translateY(24px); } 100% { opacity: 1; transform: translateY(0); } }

    .hi { font: 600 16px 'Fira Code', 'Courier New', monospace; fill: #22d3ee; animation: fadein 1.2s ease-out both; }
    @keyframes fadein { 0% { opacity: 0; } 100% { opacity: 0.9; } }

    .sub { font: 500 18px 'Fira Code', 'Courier New', monospace; fill: #cbd5e1; }
    .cursor { animation: blink 0.9s steps(1) infinite; }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }

    .cta { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #94a3b8; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 0.45; } 50% { opacity: 1; } }

    .f { font: 700 26px 'Fira Code', 'Courier New', monospace; opacity: 0; animation: floatUp 7s linear infinite; }
    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0; }
      12% { opacity: 0.55; }
      85% { opacity: 0.55; }
      100% { transform: translateY(-310px) rotate(12deg); opacity: 0; }
    }

    .s { fill: #fff; opacity: 0.2; animation: twinkle 3s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.1; } 50% { opacity: 0.9; } }

    .run { animation: run 6s linear infinite; }
    @keyframes run { to { stroke-dashoffset: -100; } }

    .dot { animation: pulse 3s ease-in-out infinite; }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- twinkling stars -->
    <circle class="s" cx="60"  cy="70"  r="1.6" style="animation-delay:0s"/>
    <circle class="s" cx="140" cy="30"  r="1.2" style="animation-delay:.6s"/>
    <circle class="s" cx="230" cy="215" r="1.4" style="animation-delay:1.2s"/>
    <circle class="s" cx="330" cy="40"  r="1.8" style="animation-delay:.3s"/>
    <circle class="s" cx="470" cy="22"  r="1.2" style="animation-delay:1.8s"/>
    <circle class="s" cx="590" cy="225" r="1.6" style="animation-delay:.9s"/>
    <circle class="s" cx="690" cy="40"  r="1.4" style="animation-delay:2.1s"/>
    <circle class="s" cx="770" cy="200" r="1.8" style="animation-delay:1.5s"/>
    <circle class="s" cx="840" cy="80"  r="1.3" style="animation-delay:.4s"/>
    <circle class="s" cx="880" cy="150" r="1.1" style="animation-delay:2.4s"/>

    <!-- floating code symbols -->
    <text class="f" x="45"  y="285" fill="#22d3ee" style="animation-delay:0s;animation-duration:7s">&lt;/&gt;</text>
    <text class="f" x="140" y="285" fill="#a78bfa" style="animation-delay:1.4s;animation-duration:8s">{ }</text>
    <text class="f" x="235" y="285" fill="#f472b6" style="animation-delay:3.1s;animation-duration:6.5s">;</text>
    <text class="f" x="320" y="285" fill="#34d399" style="animation-delay:.8s;animation-duration:9s">#</text>
    <text class="f" x="410" y="285" fill="#fbbf24" style="animation-delay:4.2s;animation-duration:7.5s">=&gt;</text>
    <text class="f" x="520" y="285" fill="#22d3ee" style="animation-delay:2.2s;animation-duration:8.5s">( )</text>
    <text class="f" x="610" y="285" fill="#f472b6" style="animation-delay:5.3s;animation-duration:7s">[ ]</text>
    <text class="f" x="700" y="285" fill="#34d399" style="animation-delay:1.1s;animation-duration:6.8s">py</text>
    <text class="f" x="775" y="285" fill="#a78bfa" style="animation-delay:3.7s;animation-duration:8s">&lt;3</text>
    <text class="f" x="845" y="285" fill="#fbbf24" style="animation-delay:2.9s;animation-duration:7.2s">1 0</text>

    <!-- window dots -->
    <circle class="dot" cx="34" cy="32" r="7" fill="#f87171"/>
    <circle class="dot" cx="58" cy="32" r="7" fill="#fbbf24" style="animation-delay:.3s"/>
    <circle class="dot" cx="82" cy="32" r="7" fill="#34d399" style="animation-delay:.6s"/>
    <!-- code-comment greeting -->
    <text class="hi" x="450" y="72" text-anchor="middle">// hi, I'm Gouri</text>

    <!-- title (pixel font, outlined so it looks the same everywhere) -->
    <g transform="translate(164,128)"><path class="title" d="M0 -5.5V-44H11V-27.5H27.5V-44H38.5V-5.5H27.5V-22H11V-5.5Z M49.5 -5.5V-11H44V-27.5H49.5V-33H77V-27.5H82.5V-16.5H55V-11H77V-5.5ZM55 -22H71.5V-27.5H55Z M93.5 -5.5V-11H104.5V-38.5H99V-44H115.5V-11H126.5V-5.5Z M137.5 -5.5V-11H148.5V-38.5H143V-44H159.5V-11H170.5V-5.5Z M181.5 -5.5V-11H176V-27.5H181.5V-33H209V-27.5H214.5V-11H209V-5.5ZM187 -11H203.5V-27.5H187Z M225.5 0V-5.5H231V-16.5H242V-5.5H236.5V0Z M313.5 -5.5V-11H308V-44H319V-22H324.5V-44H330V-22H335.5V-44H346.5V-11H341V-5.5H335.5V-11H330V-16.5H324.5V-11H319V-5.5Z M357.5 -5.5V-11H352V-27.5H357.5V-33H385V-27.5H390.5V-11H385V-5.5ZM363 -11H379.5V-27.5H363Z M412.5 -27.5H418V-22H412.5V-5.5H401.5V-33H412.5ZM434.5 -33V-27.5H418V-33Z M445.5 -5.5V-11H456.5V-38.5H451V-44H467.5V-11H478.5V-5.5Z M489.5 -5.5V-11H484V-27.5H489.5V-33H511.5V-44H522.5V-5.5ZM495 -11H511.5V-27.5H495Z M539 -16.5V-44H555.5V-27.5H550V-16.5ZM539 -5.5V-11H550V-5.5Z"/></g>

    <!-- typing tagline -->
    <g clip-path="url(#typeclip)">
      <text class="sub" x="120" y="172" textLength="660" lengthAdjust="spacing">Learning to code | Building small projects | Growing every day</text>
    </g>
    <rect class="cursor" x="120" y="153" width="3" height="26" rx="1.5" fill="#22d3ee">
      <animate attributeName="x" values="120;780;780;120" keyTimes="0;0.4;0.9;1" dur="9s" repeatCount="indefinite"/>
    </rect>

    <!-- call to action -->
    <text class="cta" x="450" y="225" text-anchor="middle">Let's build something awesome together</text>
  </g>

  <!-- glowing border that runs around the card -->
  <rect class="run" x="2" y="2" width="896" height="256" rx="22" fill="none" stroke="url(#bd)" stroke-width="3" stroke-linecap="round" pathLength="100" stroke-dasharray="18 82"/>
  <rect x="2" y="2" width="896" height="256" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
</svg>
